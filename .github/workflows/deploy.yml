name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # A custom domain (public/CNAME, e.g. dyzyzj.top) is always served from
      # the domain root — even for a project repo — so canonical URLs must use
      # it and basePath stays empty. Without a CNAME, fall back to GitHub Pages
      # defaults: <owner>.github.io repos are root, others serve under /<repo>.
      - name: Compute base path and site URL
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          CNAME_FILE="public/CNAME"
          if [ -f "$CNAME_FILE" ] && [ -n "$(tr -d '[:space:]' < "$CNAME_FILE")" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$(tr -d '[:space:]' < "$CNAME_FILE")" >> "$GITHUB_ENV"
          elif [[ "$REPO" == *.github.io ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$OWNER.github.io" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$OWNER.github.io/$REPO" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        # The first cold install (no npm cache yet) fetches ~254 packages incl.
        # 28 platform-specific sharp binaries. Keep concurrency modest and cap
        # each fetch so a stalled connection fails fast and retries instead of
        # hanging npm until it crashes with "Exit handler never called".
        # --no-audit/--no-fund drop extra registry round-trips; http logging
        # makes any remaining stall visible in the CI log.
        run: npm ci --no-audit --no-fund --loglevel=http --maxsockets=5 --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=60000 --fetch-timeout=180000

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
