name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # GitHub hosted runners ship without swap and npm ci installs a large
      # dependency tree from scratch (no cache on the first run), which can
      # OOM and crash npm with "Exit handler never called". Add swap as a
      # safety net.
      - name: Increase swap space
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # A custom domain (public/CNAME, e.g. dyzyzj.top) is always served from
      # the domain root — even for a project repo — so canonical URLs must use
      # it and basePath stays empty. Without a CNAME, fall back to GitHub Pages
      # defaults: <owner>.github.io repos are root, others serve under /<repo>.
      - name: Compute base path and site URL
        run: |
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          CNAME_FILE="public/CNAME"
          if [ -f "$CNAME_FILE" ] && [ -n "$(tr -d '[:space:]' < "$CNAME_FILE")" ]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$(tr -d '[:space:]' < "$CNAME_FILE")" >> "$GITHUB_ENV"
          elif [[ "$REPO" == *.github.io ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$OWNER.github.io" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://$OWNER.github.io/$REPO" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        # --no-audit/--no-fund avoid extra registry round-trips that frequently
        # crash npm on CI; retries make transient network failures survivable.
        run: npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-maxtimeout=120000

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
